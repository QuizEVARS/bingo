<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bingo de Pré-Rentrée</title>
<style>
body {
font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
margin: 0;
padding: 20px;
background: #87ceeb;
background: linear-gradient(to bottom right, #87ceeb, #dda0dd, #f0e68c);
}

.main-container {
max-width: 450px;
margin: 0 auto;
background: #ffffff;
background: linear-gradient(to bottom, #ffffff, #f0f8ff);
border-radius: 15px;
box-shadow: 0 8px 25px rgba(0,0,0,0.2);
padding: 25px;
border: 2px solid #4169e1;
}

.titre {
text-align: center;
color: #4169e1;
font-size: 28px;
margin-bottom: 25px;
font-weight: bold;
text-shadow: 1px 1px 2px rgba(0,0,0,0.1);
font-family: Arial, sans-serif;
}

.message-victoire {
text-align: center;
padding: 18px;
background: #ffd700;
background: linear-gradient(45deg, #ffd700, #ff6347, #ff1493);
border-radius: 12px;
margin-bottom: 25px;
display: none;
border: 3px solid #ff4500;
}

.message-victoire h2 {
margin: 0 0 10px 0;
font-size: 24px;
color: #fff;
text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
font-family: Arial, sans-serif;
}

.message-victoire p {
margin: 0;
font-size: 18px;
color: #fff;
font-weight: bold;
text-shadow: 1px 1px 2px rgba(0,0,0,0.3);
font-family: Arial, sans-serif;
}

.bingo-grid {
display: grid;
grid-template-columns: 1fr 1fr 1fr 1fr 1fr;
gap: 5px;
margin-bottom: 30px;
padding: 10px;
background: linear-gradient(135deg, #e6e6fa, #f0f8ff);
border-radius: 12px;
}

.bingo-case {
height: 80px;
border: 2px solid #9370db;
background: #f8f8ff;
background: linear-gradient(to bottom, #ffffff, #f0f8ff);
border-radius: 8px;
cursor: pointer;
display: flex;
align-items: center;
justify-content: center;
padding: 8px;
font-size: 9px;
line-height: 1.3;
text-align: center;
transition: all 0.3s;
word-wrap: break-word;
hyphens: auto;
-webkit-hyphens: auto;
hyphenate-limit-lines: 2;
hyphenate-limit-chars: 8 3 3;
overflow-wrap: break-word;
overflow: hidden;
color: #333;
font-family: 'Segoe UI', Tahoma, sans-serif;
font-weight: 500;
}

.bingo-case:hover {
background: #e6e6fa;
transform: scale(1.02);
border-color: #4169e1;
}

.bingo-case.checked {
background: rgba(50, 205, 50, 0.3);
border-color: #32cd32;
box-shadow: 0 0 8px rgba(50, 205, 50, 0.5);
color: #333;
}

.bingo-case.checked:hover {
background: rgba(50, 205, 50, 0.4);
transform: scale(1);
}

.reset-btn {
display: block;
margin: 0 auto;
padding: 15px 30px;
background: #ff6347;
background: linear-gradient(135deg, #ff6347, #ff1493, #4169e1);
color: white;
border: none;
border-radius: 25px;
font-size: 18px;
cursor: pointer;
font-weight: bold;
box-shadow: 0 5px 15px rgba(0,0,0,0.3);
border: 2px solid #ff4500;
font-family: Arial, sans-serif;
}

.reset-btn:hover {
transform: translateY(-2px);
box-shadow: 0 8px 20px rgba(0,0,0,0.4);
background: linear-gradient(135deg, #ff4500, #ff1493, #4169e1);
}

@keyframes blink {
0% { opacity: 1; }
50% { opacity: 0.7; }
100% { opacity: 1; }
}

.victoire-anim {
animation: blink 0.8s infinite;
}

/* Pour les téléphones */
@media (max-width: 500px) {
.main-container {
max-width: 95%;
padding: 15px;
}

.bingo-case {
height: 100px;
font-size: 10px;
padding: 6px;
line-height: 1.2;
}

.titre {
font-size: 24px;
}

.bingo-grid {
gap: 3px;
padding: 8px;
}
}

@media (max-width: 400px) {
.bingo-case {
height: 110px;
font-size: 9px;
padding: 5px;
line-height: 1.1;
}

.bingo-grid {
gap: 2px;
}
}

@media (max-width: 350px) {
.bingo-case {
height: 115px;
font-size: 8px;
}
}
</style>
</head>
<body>
<div class="main-container">
<h1 class="titre">BINGO de Pré-Rentrée 🦎</h1>
<div class="message-victoire" id="msg-victoire">
<h2> BINGO ! </h2>
<p>Une pré-rentrée réussie 😎</p>
</div>
<div class="bingo-grid" id="grid">
<!-- cases générées en JS -->
</div>
<button class="reset-btn" onclick="nouvellePartie()">🔄 Recommencer</button>
</div>

<script>
// Toutes les phrases du bingo
var phrases = [
"Laurent porte ses nouvelles chaussures vegan et Tim est en kimono",
"Un.e collègue découvre que ses vœux d'EDT ont été ignorés",
"Cris intempestifs : « Et les emplois du temps ? »",
"Méticuleuse présentation d'Elisabeth de l'AP seconde",
"Notre groupe WhatsApp s'assoit naturellement au milieu à gauche (côté fenêtre) (80% de l'effectif)",
"Le mot « laïcité » sort avant la fin de la première heure de la plénière",
"La photocopieuse est déjà en panne",
"Jérôme Sarazin revient sur les réformes du pro avec un ton fataliste",
"Les CPE annoncent un nouveau changement sur la règle des 5 min de retard",
"Sabrina encourage les collègues à cotiser à l'amicale",
"Quelqu'un.e arrive en retard et se fait afficher par les cheffes",
"Une remarque gênante est faite par quelqu'un.e sur le physique d'un.e nouveau/elle collègue",
"Bruits des collègues d'EPS au fond",
"KCD présente les personnels d'entretien/cuisine en précisant qu'iels doivent partir très vite",
"Florence prend frénétiquement des notes",
"Juliet a déjà toutes ses affaires sur la table de la SDP",
"Les représentant.es syndicaux n'osent pas prendre parole",
"KCD parle des enjeux de l'IA pendant trop longtemps",
"Au moins 15 personnes jouent à ce bingo",
"World café l'aprèm",
"Rénovation du lycée et canicule sont évoquées de manière paternaliste",
"Estelle et William sortent faire une longue pause pendant la plénière",
"Lea photographe n'est pas assez en hauteur pour la photo de groupe",
"Mme Issaad quitte la plénière avant la fin"
];

var grilleData = [];

function calculerTaille(texte) {
var longueur = texte.length;
var taille;

if (window.innerWidth <= 350) {
if (longueur > 140) taille = 6;
else if (longueur > 120) taille = 7;
else if (longueur > 100) taille = 8;
else if (longueur > 80) taille = 8.5;
else if (longueur > 60) taille = 9;
else taille = 9.5;
} else if (window.innerWidth <= 400) {
if (longueur > 140) taille = 6.5;
else if (longueur > 120) taille = 7;
else if (longueur > 100) taille = 7.5;
else if (longueur > 80) taille = 8;
else if (longueur > 60) taille = 8.5;
else taille = 9;
} else if (window.innerWidth <= 500) {
if (longueur > 140) taille = 7;
else if (longueur > 120) taille = 7.5;
else if (longueur > 100) taille = 8;
else if (longueur > 80) taille = 8.5;
else if (longueur > 60) taille = 9;
else taille = 9.5;
} else {
if (longueur > 140) taille = 7.5;
else if (longueur > 120) taille = 8;
else if (longueur > 100) taille = 8.5;
else if (longueur > 80) taille = 9;
else if (longueur > 60) taille = 9.5;
else taille = 10;
}

return taille;
}

// fonction pour mélanger un tableau
function melangerTableau(arr) {
var nouveauTableau = [];
for (var i = 0; i < arr.length; i++) {
nouveauTableau.push(arr[i]);
}
// mélange Fisher-Yates
for (var i = nouveauTableau.length - 1; i > 0; i--) {
var j = Math.floor(Math.random() * (i + 1));
var temp = nouveauTableau[i];
nouveauTableau[i] = nouveauTableau[j];
nouveauTableau[j] = temp;
}
return nouveauTableau;
}

// Initialiser la grille
function initGrille() {
var phrasesMelangees = melangerTableau(phrases);
grilleData = [];
for (var i = 0; i < 25; i++) {
grilleData.push({
id: i,
texte: phrasesMelangees[i],
coche: false
});
}
afficherLaGrille();
document.getElementById('msg-victoire').style.display = 'none';
}

// Afficher la grille sur la page
function afficherLaGrille() {
var container = document.getElementById('grid');
container.innerHTML = '';
for (var i = 0; i < grilleData.length; i++) {
var div = document.createElement('div');
div.className = 'bingo-case';
if (grilleData[i].coche) {
div.className = div.className + ' checked';
}
div.textContent = grilleData[i].texte;

// Ajuster taille texte
var taille = calculerTaille(grilleData[i].texte);
div.style.fontSize = taille + 'px';

// Ajouter l'événement de clic
div.setAttribute('data-id', i);
div.addEventListener('click', function() {
var id = parseInt(this.getAttribute('data-id'));
cocherCase(id);
});
container.appendChild(div);
}
}

// Cocher/décocher une case
function cocherCase(id) {
grilleData[id].coche = !grilleData[id].coche;
afficherLaGrille();
// Vérifier victoire après un petit délai
setTimeout(function() {
checkVictoire();
}, 100);
}

// Vérifier s'il y a victoire
function checkVictoire() {
var casescochees = [];
// Récupérer les cases cochées
for (var i = 0; i < grilleData.length; i++) {
if (grilleData[i].coche === true) {
casescochees.push(i);
}
}

var gagnant = false;

// Vérifier lignes horizontales
for (var ligne = 0; ligne < 5; ligne++) {
var nbCochees = 0;
for (var col = 0; col < 5; col++) {
var position = ligne * 5 + col;
if (casescochees.indexOf(position) !== -1) {
nbCochees++;
}
}
if (nbCochees == 5) {
gagnant = true;
}
}

// Vérifier colonnes verticales
for (var col = 0; col < 5; col++) {
var nbCochees = 0;
for (var ligne = 0; ligne < 5; ligne++) {
var position = ligne * 5 + col;
if (casescochees.indexOf(position) >= 0) {
nbCochees++;
}
}
if (nbCochees === 5) {
gagnant = true;
}
}

// Diagonale principale (0,6,12,18,24)
var diag1 = 0;
var positions1 = [0, 6, 12, 18, 24];
for (var i = 0; i < positions1.length; i++) {
if (casescochees.indexOf(positions1[i]) != -1) {
diag1++;
}
}
if (diag1 == 5) gagnant = true;

// Diagonale inverse (4,8,12,16,20)
var diag2 = 0;
var positions2 = [4, 8, 12, 16, 20];
for (var i = 0; i < positions2.length; i++) {
if (casescochees.indexOf(positions2[i]) >= 0) {
diag2++;
}
}
if (diag2 === 5) gagnant = true;

if (gagnant) {
var msgDiv = document.getElementById('msg-victoire');
msgDiv.style.display = 'block';
msgDiv.className = 'message-victoire victoire-anim';
} else {
var msgDiv = document.getElementById('msg-victoire');
msgDiv.style.display = 'none';
msgDiv.className = 'message-victoire';
}
}

function nouvellePartie() {
var msgDiv = document.getElementById('msg-victoire');
msgDiv.style.display = 'none';
msgDiv.className = 'message-victoire';
initGrille();
}

// Démarrer quand la page est chargée
window.addEventListener('load', function() {
initGrille();
});
</script>
</body>
</html>
